<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>basic calculator</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
    }

    body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #0f0f1a;
    overflow: hidden;
    position: relative;
}

body::before,
body::after {
    content: "";
    position: absolute;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.6;
}

body::before {
    background: #7f5af0;
    top: -100px;
    left: -100px;
}

body::after {
    background: #2cb67d;
    bottom: -100px;
    right: -100px;
}

    .container {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 20px;
    padding: 30px;
    width: 100%;
    max-width: 350px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    text-align: center;
    color: white;
}

    h2 {
        color: white;
        margin-bottom: 20px;
    }

    input {
        width: 100%;
        padding: 12px;
        margin-bottom: 15px;
        border-radius: 8px;
        border: 1px solid #ccc;
        font-size: 16px;
    }

    .buttons {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
    }

    button {
    padding: 12px;
    font-size: 18px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    color: white;
    font-weight: bold;
    background: linear-gradient(135deg, #7f5af0, #2cb67d);
    background-size: 200% 200%;
    transition: 0.3s ease;
}

button:hover {
    background-position: 100% 50%;
    transform: scale(1.08);
    box-shadow: 0 0 15px rgba(127, 90, 240, 0.7),
                0 0 25px rgba(44, 182, 125, 0.6);
}

    #result {
        margin-top: 20px;
        font-size: 20px;
        font-weight: bold;
    }

    @media (max-width: 400px) {
        .container {
            padding: 15px;
        }
        button {
            font-size: 16px;
        }
    }
</style>
</head>

<body>

<div class="container">

    <h2>calculator</h2>

    <input id="num1" type="number" placeholder="number 1">
    <input id="num2" type="number" placeholder="number 2">

    <div class="buttons">
        <button onclick="calculate('+')">+</button>
        <button onclick="calculate('-')">-</button>
        <button onclick="calculate('*')">*</button>
        <button onclick="calculate('/')">/</button>
    </div>

    <div id="result"></div>
</div>

<script>
function calculate(prc) {
    let x = Number(document.getElementById("num1").value);
    let y = Number(document.getElementById("num2").value);
    let result;

    if (prc == "+") {
        result = x + y;
    }
    
    if (prc == "-") {
        result = x - y;
    }

    if (prc == "*") {
        result = x * y;
    }

    if (prc == "/") {
        result = x / y;
    }

    document.getElementById("result").innerText = "result: " + result;
}
</script>

</body>
</html>
